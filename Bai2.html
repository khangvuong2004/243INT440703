<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bài tập 2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
    }
    .quiz-box {
      background-color: #2f3640;
      color: white;
      padding: 30px;
      width: 500px;
      border-radius: 15px;
      margin: auto;
    }
    .option {
      background-color: #3b3b3b;
      margin: 10px 0;
      padding: 10px;
      border-radius: 5px;
    }
    .submit-btn {
      background-color: #2ecc71;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #27ae60;
    }
  </style>
</head>
<body>

<h2>Bài tập 2</h2>

<div class="quiz-box">
  <h3>What is a correct syntax for an HTML hyperlink?</h3>
  <div class="option"><input type="radio" name="answer"> &lt;a href='/home.htm'&gt;Visit W3Schools.com!&lt;/a&gt;</div>
  <div class="option"><input type="radio" name="answer"> &lt;link href='/home.htm'&gt;Visit W3Schools.com!&lt;/link&gt;</div>
  <div class="option"><input type="radio" name="answer"> &lt;alink href='/home.htm'&gt;Visit W3Schools.com!&lt;/alink&gt;</div>
  <br>
  <button class="submit-btn">Submit Answer »</button>
</div>

</body>
</html>
