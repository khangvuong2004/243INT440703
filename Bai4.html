<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập | Trường ĐH Văn Hiến</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .left {
      flex: 1;
      background-image: url('https://portal.vhu.edu.vn/Content/images/bg.jpg'); /* bạn có thể thay ảnh khác */
      background-size: cover;
      background-position: center;
    }

    .right {
      flex: 1;
      background-color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px;
      box-shadow: -2px 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      color: #003366;
      margin-bottom: 10px;
    }

    label {
      font-weight: bold;
      display: block;
      margin: 15px 0 5px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .checkbox {
      margin: 15px 0;
    }

    .btn {
      background-color: #003366;
      color: white;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .btn:hover {
      background-color: #00509e;
    }

    .alt-login {
      background-color: #d83b01;
    }

    .alt-login:hover {
      background-color: #b93100;
    }

    .note {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-top: 20px;
    }

  </style>
</head>
<body>

<div class="container">
  <div class="left"></div>

  <div class="right">
    <h2>TRƯỜNG ĐẠI HỌC VĂN HIẾN</h2>
    <h3>ĐĂNG NHẬP</h3>

    <label for="username">Tên đăng nhập</label>
    <input type="text" id="username" placeholder="Nhập mã sinh viên">

    <label for="password">Mật khẩu</label>
    <input type="password" id="password" placeholder="Nhập mật khẩu">

    <div class="checkbox">
      <label><input type="checkbox"> Phụ huynh sinh viên đăng nhập</label>
    </div>

    <button class="btn">Đăng nhập</button>
    <button class="btn alt-login">Đăng nhập Office 365</button>

    <div class="note">
      <a href="#">Quên mật khẩu?</a>
    </div>
  </div>
</div>

</body>
</html>
